name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Project Directory
        id: find_dir
        run: |
          echo "=== Root Contents ==="
          ls -la
          
          # Search for build.gradle or build.gradle.kts
          BUILD_FILE=$(find . -name "build.gradle.kts" -o -name "build.gradle" | grep -v "/app/" | head -n 1)
          
          if [ -n "$BUILD_FILE" ]; then
            TARGET_DIR=$(dirname "$BUILD_FILE")
          else
            TARGET_DIR="."
          fi
          
          echo "PROJECT_PATH=$TARGET_DIR" >> $GITHUB_ENV
          echo "Target project path: $TARGET_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Wrapper
        run: gradle wrapper
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Make Gradlew Executable
        run: chmod +x gradlew
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_PATH }}/app/build/outputs/apk/debug/*.apk
