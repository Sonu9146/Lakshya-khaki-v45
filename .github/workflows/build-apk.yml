name: Build Lakshya Khaki V45

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract V45 Project
        run: |
          set -e

          rm -rf .tmp_extract
          mkdir -p .tmp_extract

          unzip -q LakshyaKhaki_Native_v45_COMPLETE.zip -d .tmp_extract

          SETTINGS_FILE=$(find .tmp_extract -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: Gradle settings file not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Project root: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. ./

          rm -rf .tmp_extract

          test -f gradlew
          test -d app

          echo "Project extracted successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LakshyaKhaki-V45-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
