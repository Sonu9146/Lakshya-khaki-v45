name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Project Root
        id: locate-root
        run: |
          BUILD_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: Could not find settings.gradle[.kts]"
            exit 1
          fi
          DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Found project at: $DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          
